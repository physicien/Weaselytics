[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "weaselytics"
version = "0.0.1"
authors = [
  { name="Emmanuel Bourret", email="emmanuel.bourret@umontreal.ca" },
]
description = "Python package to extract and analyse chromatographic data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "pandas",
    "pybaselines @ git+https://github.com/derb12/pybaselines@development",
    "scikit-image",
    "diptest",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/physicien/Weaselytics"
Issues = "https://github.com/physicien/Weaselytics/issues"

[project.scripts]
weaselytics = "weaselytics.weaselytics:main"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["weaselytics*"]
exclude = ["weaselytics.tests*", "weaselytics.tests.*"]

[tool.ruff]
target-version = "py311"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"weaselytics/tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "single"
